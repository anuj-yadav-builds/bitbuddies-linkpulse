{% extends 'base_public.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Register - LinkPulse{% endblock %}
{% block content %}
<div class="card p-4 center-box">
  <h4 class="mb-3">Create account</h4>
  <form method="post">
    {{ csrf() }}
    <input class="form-control mb-2" name="name" placeholder="Full name" required>
    <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
    <input class="form-control mb-3" type="password" name="password" placeholder="Password" minlength="6" required>
    <button class="btn btn-primary w-100">Register</button>
  </form>
  <p class="small text-center mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
